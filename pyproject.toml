[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "texera"
version = "0.1.0"
description = "Apache Texera - Collaborative Data Science Platform"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # === Agent / LLM ===
    "smolagents[openai]==1.23.0",
    "litellm[proxy]",
    "gradio>=5.50.0",
    "transformers==4.57.3",

    # === Core Data Science ===
    "numpy==2.1.0",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "lxml==5.3.0",
    "beautifulsoup4==4.12.3",
    "geopandas==1.0.1",
    "cdflib==1.3.1",
    "pyarrow==21.0.0",
    "scikit-learn==1.5.0",
    # LongDS tasks name model families the UDF venv must actually provide —
    # bi__task1 t24 asks for five INCLUDING XGBoost, so that turn was
    # unwinnable for every arm ever run (195 `No module named 'xgboost'`).
    # macOS also needs the OpenMP runtime: `brew install libomp`.
    "xgboost>=3.0",
    "duckdb>=1.0",
    "scikit-image==0.25.2",

    # Torch: pin to CPU wheel on Linux x86_64 to avoid NVIDIA CUDA deps.
    # See [tool.uv.sources] below for the PyTorch CPU index.
    "torch==2.8.0 ; platform_system != 'Linux' or platform_machine != 'x86_64'",
    "torch==2.8.0+cpu ; platform_system == 'Linux' and platform_machine == 'x86_64'",

    # === Visualization ===
    "plotly==5.24.1",
    "wordcloud==1.9.3",
    "pillow==12.1.1",

    # === Database / Storage ===
    "SQLAlchemy==2.0.37",
    "pg8000==1.31.5",
    "pyiceberg==0.11.1",
    "s3fs==2025.9.0",
    "aiobotocore==2.25.1",
    "botocore==1.40.53",
    "boto3==1.40.53",

    # === Utilities ===
    "setuptools==80.10.2",
    "loguru==0.7.0",
    "python-dateutil==2.8.2",
    "typing_extensions==4.14.1",
    "tenacity==8.5.0",
    "overrides==7.4.0",
    "Deprecated==1.2.14",
    "bidict==0.22.0",
    "cached_property==1.5.2",
    "readerwriterlock==1.0.9",
    "psutil==5.9.0",
    "tzlocal==2.1",
    "fs==2.4.16",
    "pampy==0.3.0",
    "pybase64==1.3.2",

    # === Serialization / Protocol ===
    "protobuf==4.25.8",
    "betterproto==2.0.0b7",
    "black==24.3.0",

    # === External APIs ===
    "praw==7.6.1",

    # === Profiling ===
    "ydata-profiling",
    "pympler==1.1",

    # === LSP Server ===
    "python-lsp-server[all]==1.12.0",

    # === Hamilton Execution Sidecar ===
    "sf-hamilton>=1.62",
    "fastapi>=0.104",
    "uvicorn>=0.24",
]

[project.optional-dependencies]
dev = [
    "wheel==0.41.2",
    "pytest==7.4.0",
    "pytest-timeout==2.2.0",
    "pytest-reraise==2.1.2",
    "iniconfig==1.1.1",
    "ruff==0.14.7",
    "flake8==7.1.1",
    "Flake8-pyproject==1.2.3",
    "black==24.3.0",
    # protoc compiler (matches bin/protoc-version.txt); pairs with the
    # betterproto plugin so sbt's genPythonProto can regenerate Python bindings.
    # No arm64-macOS wheel exists for this pin, and `uv sync --all-extras` is a
    # hard error (not a skip) when a listed distribution has no compatible
    # wheel — which made the documented setup command fail on Apple Silicon.
    # Excluded there; use `brew install protobuf` if you need to regenerate.
    # PEP 508 marker grammar has no unary `not`, so the intended
    # `not (darwin and arm64)` has to be written via De Morgan or setuptools
    # rejects the whole file with `optional-dependencies.dev[9] must be pep508`
    # — which broke `uv sync --all-extras` on every platform, not just macOS.
    "protoc-wheel-0==3.19.4 ; sys_platform != 'darwin' or platform_machine != 'arm64'",
]
kramabench = [
    # Persistent kernels for the DSGym executor and retrieval regression suite.
    "jupyter-client==8.10.0",
    "ipykernel==6.29.5",
    "ipython==8.35.0",

    # Domain-Specific Tools
    "pymsis==0.12.0",
    "edgartools==3.14.6",
    "PyMuPDF==1.25.5",
    "PyPDF2==3.0.1",
    "skyfield==1.54",

    # NLP / Text Processing
    "nltk==3.9.1",
    "rouge-score==0.1.2",
    "rank-bm25==0.2.2",
    "RapidFuzz==3.13.0",
    "textdistance==4.6.3",
    "Unidecode==1.3.8",

    # Browser Automation
    "selenium==4.31.0",

    # Utilities
    "untruncate-json==1.1.0",
    "python-dotenv==1.2.0",
    "typeguard==4.4.4",
    "pyheaven==0.1.6.8",
]
eval = [
    # FeTaQA-style native evaluation: corpus BLEU + ROUGE-1/2/L
    "sacrebleu>=2.4",
    "rouge-score==0.1.2",
    "nltk==3.9.1",
]

[tool.setuptools]
packages = []

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", ".venv", "build", "dist"]

[tool.black]
line-length = 120
target-version = ["py312"]

# Pull torch CPU wheels from the PyTorch index on Linux x86_64.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux' and platform_machine == 'x86_64'" },
]
