<a
  nz-dropdown
  [nzDropdownMenu]="menu">
  <span
    nz-icon
    nzType="setting"
    nzTheme="outline"></span>
</a>
<nz-dropdown-menu #menu="nzDropdownMenu">
  <ul nz-menu>
    <li nz-menu-item>
      <nz-switch
        [(ngModel)]="showTimestamp"
        [nzCheckedChildren]="checkedTemplate"
        [nzUnCheckedChildren]="unCheckedTemplate"></nz-switch>
      Show Timestamp
      <ng-template #checkedTemplate
        ><span
          nz-icon
          nzType="check"></span
      ></ng-template>
      <ng-template #unCheckedTemplate
        ><span
          nz-icon
          nzType="close"></span
      ></ng-template>
    </li>
    <li nz-menu-item>
      <nz-switch
        [(ngModel)]="showSource"
        [nzCheckedChildren]="checkedTemplate"
        [nzUnCheckedChildren]="unCheckedTemplate"></nz-switch>
      Show Source
      <ng-template #checkedTemplate
        ><span
          nz-icon
          nzType="check"></span
      ></ng-template>
      <ng-template #unCheckedTemplate
        ><span
          nz-icon
          nzType="close"></span
      ></ng-template>
    </li>
  </ul>
</nz-dropdown-menu>

<nz-list
  nzSize="small"
  class="console-list-container"
  #consoleList>
  <nz-list-item
    *ngFor="let entry of consoleMessages"
    class="console-message-entry"
    nzNoFlex>
    <div class="console-message-row">
      <div class="console-message-badge">
        <nz-badge
          [nzStatus]="getMessageLabel(entry)"
          [nzTitle]="entry.msgType.name"
          class="type-tag"></nz-badge>
      </div>

      <div class="console-message-body">
        <!-- Floated right so it stays on the first line of the body, while the
             message text wraps around (and below) it when it overflows. -->
        <div class="console-message-meta">
          <nz-tag
            *ngIf="showSource"
            class="source-tag">
            {{ entry.source }}
          </nz-tag>
          <nz-tag
            *ngIf="showTimestamp"
            class="timestamp-tag"
            nz-tooltip
            [nzTooltipTitle]="(entry.timestamp.seconds * 1000 + entry.timestamp.nanos * 0.000001) | date : 'yyyy-MM-dd HH:mm:ss.SSS'">
            {{ (entry.timestamp.seconds * 1000 + entry.timestamp.nanos * 0.000001) | date : "HH:mm:ss" }}
          </nz-tag>
          <nz-tag
            *ngIf="entry.workerId"
            class="worker-tag"
            [nzColor]="getWorkerColor(getWorkerIndex(entry.workerId))">
            {{ workerIdToAbbr(entry.workerId) }}
          </nz-tag>
        </div>
        <nz-collapse
          *ngIf="entry.message.length !== 0"
          nzGhost>
          <nz-collapse-panel
            [nzShowArrow]="false"
            [nzHeader]="customHeader"
            [nzActive]="false"
            [nzDisabled]="false"
            class="collapse-remove-padding">
            <ng-template #customHeader>
              <div class="collapse-message-header">{{ entry.title }}</div>
            </ng-template>
            <div class="console-message">{{ entry.message }}</div>
          </nz-collapse-panel>
        </nz-collapse>
        <div
          *ngIf="entry.message.length === 0"
          class="console-message">
          {{ entry.title }}
        </div>
      </div>
    </div>
  </nz-list-item>
</nz-list>

<div
  *ngIf="consoleInputEnabled"
  class="debugger-bar">
  <!-- Action toolbar: media-player style. Continue is the primary, "go" action.
       Step / Retry / Skip are secondary. Worker target is on the left. -->
  <div class="debugger-controls">
    <nz-select
      class="debugger-worker"
      nzSize="small"
      [(ngModel)]="targetWorker"
      nz-tooltip
      nzTooltipTitle="Target worker"
      nzTooltipPlacement="top">
      <nz-option
        *ngFor="let workerId of workerIds"
        [nzLabel]="workerIdToAbbr(workerId)"
        [nzValue]="workerId"></nz-option>
      <nz-option
        [nzLabel]="ALL_WORKERS"
        [nzValue]="ALL_WORKERS"></nz-option>
    </nz-select>

    <div
      nz-button-group
      class="debugger-actions">
      <button
        nz-button
        nzSize="small"
        (click)="onClickSkipTuples()"
        nz-tooltip
        nzTooltipTitle="Skip current tuple"
        nzTooltipPlacement="top">
        <span
          nz-icon
          nzType="forward"
          nzTheme="outline"></span>
      </button>
      <button
        nz-button
        nzSize="small"
        (click)="onClickRetryTuples()"
        nz-tooltip
        nzTooltipTitle="Retry current tuple"
        nzTooltipPlacement="top">
        <span
          nz-icon
          nzType="redo"
          nzTheme="outline"></span>
      </button>
      <button
        nz-button
        nzSize="small"
        (click)="onClickStep()"
        nz-tooltip
        nzTooltipTitle="Step over"
        nzTooltipPlacement="top">
        <span
          nz-icon
          nzType="step-forward"
          nzTheme="outline"></span>
      </button>
      <button
        nz-button
        nzType="primary"
        nzSize="small"
        (click)="onClickContinue()"
        nz-tooltip
        nzTooltipTitle="Continue"
        nzTooltipPlacement="top">
        <span
          nz-icon
          nzType="caret-right"
          nzTheme="outline"></span>
      </button>
    </div>
  </div>

  <!-- REPL-style command line -->
  <div class="debugger-prompt">
    <span
      class="debugger-prompt-symbol"
      nz-icon
      nzType="right"
      nzTheme="outline"></span>
    <input
      type="text"
      nz-input
      nzSize="small"
      class="debugger-prompt-input"
      placeholder="enter debug command, press Enter to send"
      [(ngModel)]="command"
      (keyup.enter)="submitDebugCommand()" />
    <button
      nz-button
      nzType="default"
      nzSize="small"
      (click)="submitDebugCommand()"
      [disabled]="!command"
      nz-tooltip
      nzTooltipTitle="Send"
      nzTooltipPlacement="top">
      <span
        nz-icon
        nzType="enter"
        nzTheme="outline"></span>
    </button>
  </div>
</div>
