<!-- Docked Button -->
<button
  id="agent-docked-button"
  nz-button
  nzType="primary"
  nzShape="circle"
  nzSize="large"
  (click)="openPanel()"
  *ngIf="!width"
  nz-tooltip
  nzTooltipPlacement="left"
  nzTooltipTitle="AI Agent">
  <span
    nz-icon
    nzType="robot"></span>
</button>

<div
  cdkDrag
  cdkDragBoundary="texera-workspace"
  id="agent-container"
  class="box"
  nz-resizable
  [nzMinWidth]="400"
  [nzMinHeight]="450"
  [nzMaxWidth]="window.innerWidth * 0.9"
  [nzMaxHeight]="window.innerHeight * 0.85"
  [style.width.px]="width"
  [style.height.px]="height"
  (nzResize)="onResize($event)"
  (cdkDragStarted)="handleDragStart()"
  [cdkDragFreeDragPosition]="dragPosition">
  <!-- Panel buttons: remove the agent, minimize -->
  <ul
    id="return-button"
    nz-menu
    [ngClass]="{'shadow': !width}"
    *ngIf="width">
    <li
      *ngIf="agent"
      nz-menu-item
      class="remove-agent"
      (click)="removeAgent()"
      nz-tooltip
      nzTooltipPlacement="bottom"
      [nzTooltipTitle]="'Remove ' + agent.name + ' from this workflow'">
      <span
        nz-icon
        nzType="delete"></span>
    </li>
    <li
      nz-menu-item
      (click)="openPanel()">
      <span
        nz-icon
        nzType="minus"></span>
    </li>
  </ul>

  <div
    #content
    id="content"
    [hidden]="!width">
    <!-- The title names the workflow's agent; the bar drags the panel. -->
    <h4
      id="title"
      cdkDragHandle>
      <span
        nz-icon
        nzType="robot"
        nzTheme="outline"
        class="title-icon"></span>
      <span class="title-text">{{ agent ? agent.name : "AI Agent" }}</span>
    </h4>

    <div class="panel-body">
      <!-- The workflow's agent list is on its way. -->
      <div
        *ngIf="loading"
        class="panel-loading">
        <nz-spin nzSimple></nz-spin>
      </div>

      <!-- The workflow's agent: one chat. Tracked by id so a new listing keeps the chat. -->
      <texera-agent-chat
        *ngFor="let shown of chatAgents; trackBy: trackAgent"
        [agentInfo]="shown"
        [isActive]="true"></texera-agent-chat>

      <!-- No agent yet: pick a model and create one for this workflow. -->
      <texera-agent-registration
        *ngIf="!loading && !agent"
        (agentCreated)="onAgentCreated($event)"></texera-agent-registration>
    </div>

    <nz-resize-handles [nzDirections]="['left', 'bottom', 'bottomLeft']"></nz-resize-handles>
  </div>
</div>
