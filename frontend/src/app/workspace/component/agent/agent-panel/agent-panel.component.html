<!-- The chat is always open: it can be resized and moved, not closed. -->
<div
  cdkDrag
  cdkDragBoundary="texera-workspace"
  id="agent-container"
  class="box"
  nz-resizable
  [nzMinWidth]="400"
  [nzMinHeight]="450"
  [nzMaxWidth]="window.innerWidth * 0.9"
  [nzMaxHeight]="maxHeight"
  [style.top.px]="top"
  [style.width.px]="width"
  [style.height.px]="height"
  (nzResize)="onResize($event)"
  [cdkDragFreeDragPosition]="dragPosition">
  <!-- Panel button: start the chat over -->
  <ul
    id="return-button"
    nz-menu
    *ngIf="agent">
    <li
      nz-menu-item
      class="remove-agent"
      (click)="removeAgent()"
      nz-tooltip
      nzTooltipPlacement="bottom"
      nzTooltipTitle="Start a new chat">
      <span
        nz-icon
        nzType="delete"></span>
    </li>
  </ul>

  <div
    #content
    id="content">
    <!-- The title names the workflow's agent; the bar drags the panel. -->
    <h4
      id="title"
      cdkDragHandle>
      <span
        nz-icon
        nzType="robot"
        nzTheme="outline"
        class="title-icon"></span>
      <span class="title-text">{{ agent ? agent.name : "AI Agent" }}</span>
    </h4>

    <div class="panel-body">
      <!-- The workflow's agent list is on its way, or its chat is starting. -->
      <div
        *ngIf="loading || startingChat"
        class="panel-loading">
        <nz-spin nzSimple></nz-spin>
        <p
          *ngIf="!loading && startingChat"
          class="panel-loading-text">
          <span *ngIf="computingUnitRunning">Starting a chat with {{ defaultModelName }}…</span>
          <span *ngIf="!computingUnitRunning">Waiting for a computing unit to start the chat…</span>
        </p>
      </div>

      <!-- The workflow's agent: one chat. Tracked by id so a new listing keeps the chat. -->
      <texera-agent-chat
        *ngFor="let shown of chatAgents; trackBy: trackAgent"
        [agentInfo]="shown"
        [isActive]="true"></texera-agent-chat>

      <!-- No agent, and the default model cannot start the chat: pick a model. -->
      <texera-agent-registration
        *ngIf="!loading && !agent && pickModel"
        (agentCreated)="onAgentCreated($event)"></texera-agent-registration>
    </div>

    <nz-resize-handles [nzDirections]="['left', 'bottom', 'bottomLeft']"></nz-resize-handles>
  </div>
</div>
