# Infra-only compose for running texera scala services via sbt outside docker.
# Brings up MinIO (S3 for Iceberg files) + Lakekeeper (Iceberg REST catalog).
# Postgres is reused from the host (already initialized at localhost:5432).

name: texera-test-infra

services:
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: texera-test-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=texera_minio
      - MINIO_ROOT_PASSWORD=password
    volumes:
      - texera_test_minio_data:/data
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    container_name: texera-test-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 texera_minio password
        mc mb --ignore-existing local/texera-iceberg
        echo "MinIO bucket 'texera-iceberg' is ready."

  lakekeeper-migrate:
    image: vakamo/lakekeeper:v0.11.0
    container_name: texera-test-lakekeeper-migrate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgres://texera:password@host.docker.internal:5432/texera_lakekeeper
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgres://texera:password@host.docker.internal:5432/texera_lakekeeper
      - LAKEKEEPER__PG_ENCRYPTION_KEY=texera_key
    restart: "no"
    entrypoint: ["/home/nonroot/lakekeeper"]
    command: ["migrate"]

  lakekeeper:
    image: vakamo/lakekeeper:v0.11.0
    container_name: texera-test-lakekeeper
    restart: always
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgres://texera:password@host.docker.internal:5432/texera_lakekeeper
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgres://texera:password@host.docker.internal:5432/texera_lakekeeper
      - LAKEKEEPER__PG_ENCRYPTION_KEY=texera_key
      - LAKEKEEPER__BASE_URI=http://localhost:8181
    ports:
      - "8181:8181"
    entrypoint: ["/home/nonroot/lakekeeper"]
    command: ["serve"]
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  lakekeeper-init:
    image: alpine:3.19
    container_name: texera-test-lakekeeper-init
    depends_on:
      lakekeeper:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        apk add --no-cache curl jq

        LAKEKEEPER_BASE_URI=http://lakekeeper:8181

        echo "Bootstrapping Lakekeeper..."
        BOOT_CODE=$$(curl -s -o /tmp/boot.txt -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d '{"accept-terms-of-use":true}' \
            "$$LAKEKEEPER_BASE_URI/management/v1/bootstrap" || echo "000")
        echo "bootstrap exit=$$BOOT_CODE"

        echo "Creating warehouse 'texera'..."
        WAREHOUSE_LIST_CODE=$$(curl -s -o /tmp/warehouses.txt -w "%{http_code}" \
            "$$LAKEKEEPER_BASE_URI/management/v1/warehouse" || echo "000")
        echo "warehouse list exit=$$WAREHOUSE_LIST_CODE"

        if jq -e '.warehouses[]? | select(.name == "texera")' /tmp/warehouses.txt >/dev/null 2>&1; then
          echo "Warehouse already exists; skipping."
        else
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"warehouse-name":"texera","project-id":"00000000-0000-0000-0000-000000000000","storage-profile":{"type":"s3","bucket":"texera-iceberg","region":"us-west-2","endpoint":"http://minio:9000","flavor":"s3-compat","path-style-access":true,"sts-enabled":false},"storage-credential":{"type":"s3","credential-type":"access-key","aws-access-key-id":"texera_minio","aws-secret-access-key":"password"}}' \
            "$$LAKEKEEPER_BASE_URI/management/v1/warehouse"
          echo "Warehouse created."
        fi

volumes:
  texera_test_minio_data:
