# Gateway for the smolagents baseline of GPT-6.1 Sol and Gemini 4 Argon (2026-10-16), run as a
# second LiteLLM container beside the dataflow gateway (litellm-config.yaml). smolagents' code agent
# sends no tools and asks for stop sequences, which needs routes the dataflow agent cannot share:
# the dataflow agent's gpt-6.1-sol route must use the Responses bridge for tool calls, and its
# gemini-4-argon routes are pinned to Google AI Studio, which ignores `stop`.

litellm_settings:
  callbacks: [strict_tools.hook]
  drop_params: true

model_list:
  # GPT-6.1 Sol on plain Chat Completions, as the gpt-5.6 routes served smolagents (with no tools
  # LiteLLM never bridged those to Responses). The harness treats gpt-5*/gpt-6* as reasoning models
  # and sends neither `stop` nor temperature (script_agent_child.py); dropping both here is only a
  # safety net, since OpenAI rejects them. LiteLLM does not list reasoning_effort for gpt-6.1-sol
  # and would drop it, hence allowed_openai_params.
  - model_name: gpt-6.1-sol
    litellm_params:
      model: openai/gpt-6.1-sol
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
      allowed_openai_params: ["reasoning_effort"]
      additional_drop_params: ["stop", "temperature"]
  # Gemini 4 Argon with reasoning effort medium, pinned to Google Vertex (global, standard tier, no
  # fallback), which honours `stop` -- the Gemini 3.8 Flash smolagents baseline used Vertex for the
  # same reason. Same model and price as the dataflow route on AI Studio. The harness turns the
  # runner's model gemini-4-argon-medium into gemini-4-argon plus reasoning_effort "medium"
  # (code_agent._parse_model_and_reasoning_effort), so the route carries the bare name; the request's
  # reasoning_effort is dropped in favour of the route's reasoning {effort: medium}, which is exactly
  # what the dataflow route sends.
  - model_name: gemini-4-argon
    litellm_params:
      model: openrouter/google/gemini-4-argon
      api_base: "os.environ/OPENROUTER_BASE_URL"
      api_key: "os.environ/OPENROUTER_API_KEY"
      additional_drop_params: ["temperature", "top_p", "reasoning_effort"]
      extra_body:
        provider:
          order: ["google-vertex/global"]
          allow_fallbacks: false
        reasoning:
          effort: medium
