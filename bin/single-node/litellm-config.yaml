# LiteLLM model list for the single-node deployment. API keys are read
# from environment variables passed to the container. To add more
# models, follow the same shape — see https://docs.litellm.ai/docs/proxy/configs.

litellm_settings:
  drop_params: true

model_list:
  # ── Anthropic (latest generally available) ──────────────────────────────
  # Anthropic prompt caching is OPT-IN per request (cache_control breakpoints),
  # unlike OpenAI's automatic caching — so every OpenAI-compatible caller got
  # cached_tokens=0 on claude while the same path recorded ~85% cache reads on
  # gpt. Inject breakpoints proxy-side: one on the system prompt, one on the
  # last message (Anthropic walks back from a breakpoint to the longest cached
  # prefix, so this caches the whole growing conversation each step).
  - model_name: claude-haiku-4.5
    litellm_params:
      model: claude-haiku-4-5-20251001
      api_key: "os.environ/ANTHROPIC_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -1
  - model_name: claude-sonnet-5
    litellm_params:
      model: claude-sonnet-5
      api_key: "os.environ/ANTHROPIC_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -1
  - model_name: claude-opus-5
    litellm_params:
      model: claude-opus-5
      api_key: "os.environ/ANTHROPIC_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -1

  # ── OpenAI ───────────────────────────────────────────────────────────────
  - model_name: gpt-5.2
    litellm_params:
      model: openai/gpt-5.2
      api_key: "os.environ/OPENAI_API_KEY"
  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: "os.environ/OPENAI_API_KEY"
  # Medium-reasoning aliases. The bare gpt-5.2 / gpt-5-mini aliases send no
  # `reasoning_effort` at all, which probes byte-identical to
  # reasoning_effort:"none" (0 reasoning tokens) — so every arm on them is a
  # NO-REASONING baseline. These pin medium so a reasoning-on arm is expressible
  # without touching the baselines. Expect roughly 2x cost per task.
  - model_name: gpt-5.2-medium
    litellm_params:
      model: openai/gpt-5.2
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
  - model_name: gpt-5-mini-medium
    litellm_params:
      model: openai/gpt-5-mini
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
  - model_name: gpt-5.6
    litellm_params:
      model: openai/gpt-5.6
      api_key: "os.environ/OPENAI_API_KEY"

  # Reasoning variants — pinned to medium reasoning effort by default.
  - model_name: gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
  - model_name: gpt-5.6-tara
    litellm_params:
      model: openai/gpt-5.6-tara
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
