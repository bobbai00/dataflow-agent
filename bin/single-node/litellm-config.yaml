# LiteLLM model list for the single-node deployment. API keys are read
# from environment variables passed to the container. To add more
# models, follow the same shape — see https://docs.litellm.ai/docs/proxy/configs.

litellm_settings:
  # strict_tools.py is mounted next to this configuration in the gateway.
  callbacks: [strict_tools.hook]
  drop_params: true

model_list:
  # ── Anthropic (latest generally available) ──────────────────────────────
  # Anthropic prompt caching is OPT-IN per request (cache_control breakpoints),
  # unlike OpenAI's automatic caching — so every OpenAI-compatible caller got
  # cached_tokens=0 on claude while the same path recorded ~85% cache reads on
  # gpt. Inject breakpoints proxy-side. Anthropic reuses a prefix only if a
  # PREVIOUS request already wrote a cache entry at that exact boundary, so a
  # breakpoint is worth having only where the bytes are stable across steps:
  #   system  - never changes.
  #   index -2 - end of the append-only region. Under the native layout the
  #     last message is a re-rendered "current state" block that differs every
  #     step, so an entry written at -1 can never be matched; -2 lands on the
  #     final tool result, which IS a byte-identical prefix of the next step.
  #   index -1 - still useful for a retry of the same step.
  # Dropping -2 is what made native cost 81% more than block on environment:
  # 64.7% of input tokens were cache WRITES (1.25x) with only the system
  # prompt ever read back.
  - model_name: claude-haiku-4.5
    litellm_params:
      model: claude-haiku-4-5-20251001
      api_key: "os.environ/ANTHROPIC_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -2
        - location: message
          index: -1
  - model_name: claude-sonnet-5
    litellm_params:
      model: claude-sonnet-5
      api_key: "os.environ/ANTHROPIC_API_KEY"
      # sonnet-5 rejects `temperature` outright ("`temperature` is deprecated
      # for this model"), and both the dataflow agent and smolagents send it by
      # default — every request 400s and the task records 0 steps / 0 tokens.
      # Drop it at the proxy so callers need no per-model special-casing.
      additional_drop_params: ["temperature"]
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -2
        - location: message
          index: -1
  # Sonnet 5.5 uses automatic tool choice; native mode still requires Answer.
  # Leave adaptive thinking and effort at the provider defaults for this arm.
  - model_name: claude-sonnet-5.5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: "os.environ/ANTHROPIC_API_KEY"
      additional_drop_params: ["temperature", "top_p", "top_k"]
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -2
        - location: message
          index: -1
  # Haiku 5.5 thinks by default (adaptive thinking, effort medium); it
  # rejects thinking.type "enabled". Thinking is set explicitly so a provider
  # default change cannot silently turn reasoning off for this arm.
  - model_name: claude-haiku-5.5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: "os.environ/ANTHROPIC_API_KEY"
      thinking: {"type": "adaptive"}
      additional_drop_params: ["temperature", "top_p", "top_k"]
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -2
        - location: message
          index: -1
  # The same route with adaptive thinking at effort low (default: medium), for the 2026-10-17 Haiku
  # thinking-cost test. Named -lowthink, not -low: the KramaBench harness strips -high/-medium/-low
  # from smolagents model names and would send the bare route.
  - model_name: claude-haiku-5.5-lowthink
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: "os.environ/ANTHROPIC_API_KEY"
      thinking: {"type": "adaptive"}
      output_config: {"effort": "low"}
      additional_drop_params: ["temperature", "top_p", "top_k"]
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -2
        - location: message
          index: -1
  # The same route with thinking switched off (effort stays low), for the 2026-10-21 test of whether Haiku's
  # dataflow calls need their thinking. Named -nothink for the same reason as -lowthink.
  - model_name: claude-haiku-5.5-nothink
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: "os.environ/ANTHROPIC_API_KEY"
      thinking: {"type": "disabled"}
      output_config: {"effort": "low"}
      additional_drop_params: ["temperature", "top_p", "top_k"]
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -2
        - location: message
          index: -1
  - model_name: claude-opus-5
    litellm_params:
      model: claude-opus-5
      api_key: "os.environ/ANTHROPIC_API_KEY"
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -2
        - location: message
          index: -1

  # ── OpenAI ───────────────────────────────────────────────────────────────
  # Gemini 3.8 Flash: temperature stays at the provider default (lower values
  # can loop on Gemini 3), and the system prompt is cached explicitly, since
  # implicit caching missed prompts under ~22k tokens. bin/strict_tools.py
  # adapts tool schemas and drops tool_choice "auto", which a cached request
  # may not set.
  - model_name: gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      additional_drop_params: ["temperature"]
      cache_control_injection_points:
        - location: message
          role: system
  - model_name: gpt-5.2
    litellm_params:
      model: openai/gpt-5.2
      api_key: "os.environ/OPENAI_API_KEY"
  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: "os.environ/OPENAI_API_KEY"
  # Medium-reasoning aliases. The bare gpt-5.2 / gpt-5-mini aliases send no
  # `reasoning_effort` at all, which probes byte-identical to
  # reasoning_effort:"none" (0 reasoning tokens) — so every arm on them is a
  # NO-REASONING baseline. These pin medium so a reasoning-on arm is expressible
  # without touching the baselines. Expect roughly 2x cost per task.
  - model_name: gpt-5.2-medium
    litellm_params:
      model: openai/gpt-5.2
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
  - model_name: gpt-5-mini-medium
    litellm_params:
      model: openai/gpt-5-mini
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
  - model_name: gpt-5.6
    litellm_params:
      model: openai/gpt-5.6
      api_key: "os.environ/OPENAI_API_KEY"

  # Reasoning variants — pinned to medium reasoning effort by default.
  - model_name: gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
  - model_name: gpt-5.6-tara
    litellm_params:
      model: openai/gpt-5.6-tara
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
  - model_name: gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium

  # Registered-Python validation models; each route preserves the requested ID.
  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
  # GPT-6.1 Sol rejects function tools with a reasoning effort on /v1/chat/completions ("use
  # /v1/responses"). LiteLLM 1.83.10 bridges chat requests to the Responses API by itself only for
  # GPT-5.4+ (which is how the gpt-5.6 routes run), so the responses/ prefix forces the same bridge.
  # The bridge drops reasoning_effort unless it is allowed explicitly; with it the request carries
  # reasoning {effort: medium}. The bridge omits cache_write_tokens (metrics prices them as writes).
  # The agent's AI SDK treats only o-series and gpt-5* IDs as reasoning models; for gpt-6.1-sol it
  # sends temperature 0.2, which the model rejects (400). Dropping it here gives the request gpt-5.6
  # gets (no temperature); the system prompt reaches the model as Responses instructions either way.
  - model_name: gpt-6.1-sol
    litellm_params:
      model: openai/responses/gpt-6.1-sol
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
      allowed_openai_params: ["reasoning_effort"]
      additional_drop_params: ["temperature"]
  # Gemini 4 Argon through OpenRouter, pinned to Google AI Studio's standard tier with no fallback
  # (Vertex global was degraded on 2026-10-16; the dataflow agent sends no `stop`, which AI Studio
  # does not list). Temperature and top_p are dropped as on the Gemini 3 routes. gemini-4-argon keeps
  # Google's default thinking; gemini-4-argon-medium sends reasoning {effort: medium}.
  - model_name: gemini-4-argon
    litellm_params:
      model: openrouter/google/gemini-4-argon
      api_base: "os.environ/OPENROUTER_BASE_URL"
      api_key: "os.environ/OPENROUTER_API_KEY"
      additional_drop_params: ["temperature", "top_p"]
      extra_body:
        provider:
          order: ["google-ai-studio"]
          allow_fallbacks: false
  - model_name: gemini-4-argon-medium
    litellm_params:
      model: openrouter/google/gemini-4-argon
      api_base: "os.environ/OPENROUTER_BASE_URL"
      api_key: "os.environ/OPENROUTER_API_KEY"
      additional_drop_params: ["temperature", "top_p"]
      extra_body:
        provider:
          order: ["google-ai-studio"]
          allow_fallbacks: false
        reasoning:
          effort: medium
  - model_name: claude-opus-5.5
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: "os.environ/ANTHROPIC_API_KEY"
      thinking: {"type": "adaptive", "display": "summarized"}
      output_config: {"effort": "medium"}
      additional_drop_params: ["temperature", "top_p", "top_k"]
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -2
        - location: message
          index: -1
  - model_name: claude-opus-4.8
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: "os.environ/ANTHROPIC_API_KEY"
      additional_drop_params: ["temperature", "top_p", "top_k"]
      cache_control_injection_points:
        - location: message
          role: system
        - location: message
          index: -2
        - location: message
          index: -1
  - model_name: qwen3.8-27b
    litellm_params:
      model: openrouter/qwen/qwen3.8-27b
      api_base: "os.environ/OPENROUTER_BASE_URL"
      api_key: "os.environ/OPENROUTER_API_KEY"
      # Pin the serving providers so a campaign measures one model, not the
      # router: unquantized or fp8 weights with structured-output support, in
      # price order, no fallback outside the list. The fp4 routes (Sail
      # Research, Decart) and InferenceNet produced the 2026-10-08 failure loops.
      extra_body:
        provider:
          order: ["deepinfra", "dekallm", "wafer"]
          allow_fallbacks: false
  - model_name: deepseek-v4.1-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4.1-flash
      api_base: "os.environ/OPENROUTER_BASE_URL"
      api_key: "os.environ/OPENROUTER_API_KEY"
      extra_body:
        provider:
          order: ["deepinfra", "morph", "wafer"]
          allow_fallbacks: false
