# The default configuration file for starting litellm (https://docs.litellm.ai/docs/proxy/quick_start)
# To start the litellm service:
# 1. Install litellm by:
#    pip install 'litellm[proxy]'
# 2. Set your API keys as environment variable, e.g.
#    export ANTHROPIC_API_KEY=<your-api-key>
# 3. Start litellm by:
#    litellm --config bin/litellm-config.yaml
# By default, litellm is running on http://0.0.0.0:4000

# Verbose logging: logs the full outgoing request body (incl. reasoning_effort
# in extra_body) and the response usage (incl. completion_tokens_details.
# reasoning_tokens). Used to verify that gpt-5-mini-medium's reasoning_effort
# actually reaches the OpenAI API. Set back to false once diagnosis is done.
litellm_settings:
  set_verbose: true
  # Drop provider-unsupported params (e.g. `stop` for gpt-5.2 reasoning models)
  # instead of 400-erroring. Needed so the smolagents CodeAgent baseline can run
  # against gpt-5.2; harmless for the dataflow agent (which doesn't send them).
  drop_params: true

model_list:
  # ── Anthropic (latest generally available) ──────────────────────────────
  - model_name: claude-haiku-4.5
    litellm_params:
      model: claude-haiku-4-5-20251001
      api_key: "os.environ/ANTHROPIC_API_KEY"
  - model_name: claude-sonnet-5
    litellm_params:
      model: claude-sonnet-5
      api_key: "os.environ/ANTHROPIC_API_KEY"
  - model_name: claude-opus-5
    litellm_params:
      model: claude-opus-5
      api_key: "os.environ/ANTHROPIC_API_KEY"

  # ── OpenAI ───────────────────────────────────────────────────────────────
  - model_name: gpt-5.2
    litellm_params:
      model: openai/gpt-5.2
      api_key: "os.environ/OPENAI_API_KEY"
  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: "os.environ/OPENAI_API_KEY"
  # Medium-reasoning aliases. The bare gpt-5.2 / gpt-5-mini aliases send no
  # `reasoning_effort` at all, which probes byte-identical to
  # reasoning_effort:"none" (0 reasoning tokens) — so every arm on them is a
  # NO-REASONING baseline. These pin medium so a reasoning-on arm is expressible
  # without touching the baselines. Expect roughly 2x cost per task.
  - model_name: gpt-5.2-medium
    litellm_params:
      model: openai/gpt-5.2
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
  - model_name: gpt-5-mini-medium
    litellm_params:
      model: openai/gpt-5-mini
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
  - model_name: gpt-5.6
    litellm_params:
      model: openai/gpt-5.6
      api_key: "os.environ/OPENAI_API_KEY"

  # Reasoning variants — pinned to medium reasoning effort by default.
  - model_name: gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
  - model_name: gpt-5.6-tara
    litellm_params:
      model: openai/gpt-5.6-tara
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
