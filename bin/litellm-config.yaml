# The default configuration file for starting litellm (https://docs.litellm.ai/docs/proxy/quick_start)
# To start the litellm service:
# 1. Install litellm by:
#    pip install 'litellm[proxy]'
# 2. Set your API keys as environment variable, e.g.
#    export ANTHROPIC_API_KEY=<your-api-key>
# 3. Start litellm by:
#    litellm --config bin/litellm-config.yaml
# By default, litellm is running on http://0.0.0.0:4000

# Verbose logging: logs the full outgoing request body (incl. reasoning_effort
# in extra_body) and the response usage (incl. completion_tokens_details.
# reasoning_tokens). Used to verify that gpt-5-mini-medium's reasoning_effort
# actually reaches the OpenAI API. Set back to false once diagnosis is done.
litellm_settings:
  set_verbose: true
  # Drop provider-unsupported params (e.g. `stop` for gpt-5.2 reasoning models)
  # instead of 400-erroring. Needed so the smolagents CodeAgent baseline can run
  # against gpt-5.2; harmless for the dataflow agent (which doesn't send them).
  drop_params: true

model_list:
  - model_name: claude-haiku-4.5
    litellm_params:
      model: claude-haiku-4-5-20251001
      api_key: "os.environ/ANTHROPIC_API_KEY"
  - model_name: gpt-5-mini
    litellm_params:
      model: gpt-5-mini-2025-08-07
      api_key: "os.environ/OPENAI_API_KEY"
  - model_name: gpt-5-mini-medium
    litellm_params:
      model: gpt-5-mini-2025-08-07
      api_key: "os.environ/OPENAI_API_KEY"
      extra_body:
        reasoning_effort: medium
  - model_name: gpt-5.2
    litellm_params:
      model: gpt-5.2
      api_key: "os.environ/OPENAI_API_KEY"
  - model_name: gpt-5.4
    litellm_params:
      model: gpt-5.4
      api_key: "os.environ/OPENAI_API_KEY"
  # gpt-5.6-luna / -terra: these REQUIRE the Responses API to use function tools with
  # reasoning. On /v1/chat/completions the API rejects tools whenever reasoning_effort
  # is medium/low OR omitted (the model defaults to reasoning), with:
  #   "Function tools with reasoning_effort are not supported for gpt-5.6-luna in
  #    /v1/chat/completions. To use function tools, use /v1/responses or set
  #    reasoning_effort to 'none'."
  # Only reasoning_effort:"none" works there, which would silently benchmark the model
  # with reasoning DISABLED — not comparable to gpt-5-mini (~4.9k reasoning tok/task).
  # The `openai/responses/` prefix makes litellm translate the incoming
  # chat/completions request to /v1/responses, where tools + reasoning coexist.
  # Verified: bat-and-ball trap answered 5 (not the naive 10) with
  # completion_tokens_details.reasoning_tokens=17, and the outgoing request carries
  # reasoning_effort=medium.
  - model_name: gpt-5.6-luna
    litellm_params:
      model: openai/responses/gpt-5.6-luna
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
  - model_name: gpt-5.6-terra
    litellm_params:
      model: openai/responses/gpt-5.6-terra
      api_key: "os.environ/OPENAI_API_KEY"
      reasoning_effort: medium
  - model_name: gpt-4o
    litellm_params:
      model: gpt-4o
      api_key: "os.environ/OPENAI_API_KEY"