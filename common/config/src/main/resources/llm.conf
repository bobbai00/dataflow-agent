# LLM (AI copilot) configuration.
#
# Read by `org.apache.texera.common.config.LLMConfig` and consumed by the
# AccessControlService (port 9096), which runs a thin server-side proxy to a
# LiteLLM / OpenAI-compatible gateway so the GUI AI copilot never holds a
# provider key in the browser:
#
#   POST /api/chat/<route>  ->  <base-url>/v1/<route>   (e.g. chat/completions)
#   GET  /api/models        ->  <base-url>/v1/models
#
# The proxy attaches `master-key` as the `Authorization: Bearer <key>` header.
# Both routes require an authenticated REGULAR/ADMIN user and are only served
# when `copilot-enabled = true` in gui.conf (otherwise they return 403).
#
# Each setting is a hard-coded default followed by an optional environment
# override (HOCON `${?VAR}` is applied only when the variable is set), so the
# real connection details can be injected at runtime without editing this file.
#
# ---------------------------------------------------------------------------
# Connecting to the DKNet-hosted gateway
# ---------------------------------------------------------------------------
# The committed defaults below point at a local LiteLLM instance. To use the
# DKNet deployment instead, export these before launching the services (the
# forked service JVMs inherit the environment):
#
#   export LITELLM_BASE_URL="https://texera.dknet-ai.org/litellm"
#   export LITELLM_MASTER_KEY="<dknet master key — obtain from the deployment owner>"
#
# Do NOT hard-code the master key in this file: it is a secret and must not be
# committed. Keep the committed `master-key` empty and inject it via the env var.
llm {
  # Base URL of the LiteLLM / OpenAI-compatible gateway, WITHOUT the `/v1`
  # suffix (the proxy appends `/v1/<route>`). Default targets a local LiteLLM.
  base-url = "http://0.0.0.0:4000"
  base-url = ${?LITELLM_BASE_URL}

  # Key sent to the gateway as `Authorization: Bearer <key>`. SECRET — keep the
  # committed value empty and supply the real key via LITELLM_MASTER_KEY. Leave
  # empty if the gateway enforces no key.
  master-key = ""
  master-key = ${?LITELLM_MASTER_KEY}
}
